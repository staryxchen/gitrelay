services:
  app:
    build: .
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      AUTH_USERNAME: ${AUTH_USERNAME:?Set AUTH_USERNAME in .env}
      AUTH_PASSWORD_FILE: /run/secrets/auth_password
      CACHE_DIR: /var/cache/gitrelay
      CACHE_MAX_BYTES: ${CACHE_MAX_BYTES:-21474836480}
      CACHE_OBJECT_MAX_BYTES: ${CACHE_OBJECT_MAX_BYTES:-4294967296}
      CACHE_TTL: ${CACHE_TTL:-24h}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-8}
      REQUESTS_PER_SECOND: ${REQUESTS_PER_SECOND:-10}
      REQUEST_BURST: ${REQUEST_BURST:-20}
      GIT_REQUEST_MAX_BYTES: ${GIT_REQUEST_MAX_BYTES:-33554432}
      GOMEMLIMIT: 384MiB
      GOMAXPROCS: "2"
    secrets:
      - auth_password
    volumes:
      - cache:/var/cache/gitrelay
    networks:
      - relay
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 64
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "/usr/local/bin/gitrelay", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - relay
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  auth_password:
    file: ${AUTH_PASSWORD_PATH:-./secrets/auth_password}

volumes:
  cache:
  caddy_data:
  caddy_config:

networks:
  relay:
